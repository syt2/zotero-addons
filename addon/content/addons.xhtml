<?xml version="1.0"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet
href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet
href="chrome://zotero-platform/content/zotero-react-client.css"
type="text/css"?>
<?xml-stylesheet
href="chrome://zotero-platform/content/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://__addonRef__/content/virtualizedTable.css"
type="text/css"?>
<!DOCTYPE html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:xul="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  windowtype="__addonRef__-addons"
  sizemode="normal"
  scrolling="false"
  persist="screenX screenY width height sizemode"
>
  <head>
    <title data-l10n-id="title"></title>
    <meta charset="utf-8" />
    <script>
      document.addEventListener("DOMContentLoaded", (ev) => {
        try {
          Services.scriptloader.loadSubScript(
            "chrome://zotero/content/include.js",
            this,
          );

          Services.scriptloader.loadSubScript(
            "resource://zotero/require.js",
            this,
          );
        } catch (e) {}
        window.arguments[0]._initPromise.resolve();
      });
    </script>
    <style>
      html,
      body,
      .viewport {
        padding: 0;
        margin: 0;
        height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
        word-wrap: break-word;
        font-family: initial;
      }

      .viewport {
        margin: 0 5px 0 5px;
      }

      .viewport-container {
        padding: 0;
        margin: 0;
        height: calc(100% - 50px);
        width: 100%;
        display: flex;
        flex-direction: row;
        overflow: hidden;
      }

      .list-viewport {
        width: 100%;
        overflow: hidden;
      }

      #table-container {
        height: 100%;
        width: 100%;
        overflow-x: hidden;
        overflow-y: scroll;
      }

      #footer-search-group {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-inline-start: 2px;
        min-width: 0;
      }

      #search-shell {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        width: 28px;
        height: 28px;
        min-width: 28px;
        overflow: hidden;
        border-radius: 7px;
        background-color: transparent;
        transition:
          width 180ms ease,
          background-color 120ms ease,
          box-shadow 120ms ease;
      }

      #search-shell:not(.expanded):hover {
        background-color: color-mix(in srgb, currentColor 8%, transparent);
      }

      #search-shell.expanded {
        width: 180px;
        background-color: Field;
        box-shadow: inset 0 0 0 1px
          color-mix(in srgb, currentColor 22%, transparent);
      }

      #search-shell.expanded:focus-within {
        box-shadow:
          inset 0 0 0 1px AccentColor,
          0 0 0 2px color-mix(in srgb, AccentColor 16%, transparent);
      }

      #search-button,
      #refresh,
      #footer-settings-button {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        min-width: 28px;
        max-width: 28px;
        height: 28px;
        min-height: 28px;
        margin: 0;
        padding: 0;
        border: 0 !important;
        border-radius: 7px;
        background-color: transparent;
        box-shadow: none !important;
        color: ButtonText;
        appearance: none !important;
        -moz-context-properties: fill, fill-opacity;
        fill: currentColor;
        cursor: pointer;
        transition:
          background-color 120ms ease,
          transform 80ms ease;
      }

      #search-button {
        flex: 0 0 28px;
        background-image: none;
      }

      #search-icon,
      #refresh-icon {
        width: 18px;
        height: 18px;
        pointer-events: none;
      }

      #search-icon {
        background-color: currentColor;
        mask-position: center;
        mask-repeat: no-repeat;
        mask-size: contain;
        mask-image: url("chrome://zotero/skin/20/universal/magnifier.svg");
      }

      #refresh-icon {
        background-color: transparent;
        background-image: url("chrome://zotero/skin/20/universal/sync.svg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        -moz-context-properties: fill, fill-opacity;
        fill: currentColor;
      }

      #search-button:active,
      #refresh:active,
      #footer-settings-button:active {
        transform: scale(0.92);
      }

      #refresh:hover {
        background-color: color-mix(
          in srgb,
          currentColor 8%,
          transparent
        ) !important;
      }

      #footer-settings-button:hover,
      .footer-settings.is-open #footer-settings-button {
        background-color: color-mix(
          in srgb,
          currentColor 8%,
          transparent
        ) !important;
      }

      #search-button:focus-visible,
      #refresh:focus-visible,
      #footer-settings-button:focus-visible {
        outline: none;
      }

      #search-button:focus-visible {
        box-shadow: inset 0 0 0 2px AccentColor !important;
      }

      #refresh:focus-visible {
        outline: 2px solid AccentColor;
        outline-offset: 1px;
      }

      #footer-settings-button:focus-visible {
        box-shadow: inset 0 0 0 2px AccentColor !important;
      }

      #search-field {
        box-sizing: border-box;
        flex: 1 1 auto;
        width: 100%;
        min-width: 0;
        max-width: none;
        height: 28px;
        padding: 0 10px 0 0;
        margin: 0;
        border: 0 !important;
        border-radius: 0;
        outline: 0 !important;
        background: transparent !important;
        box-shadow: none !important;
        color: FieldText;
        font: inherit;
        font-size: 13px;
        line-height: 28px;
        appearance: none !important;
        cursor: text !important;
        opacity: 0;
        pointer-events: none;
        transition: opacity 100ms ease;
      }

      #search-shell.expanded #search-field {
        opacity: 1;
        pointer-events: auto;
      }

      #search-field::placeholder {
        color: color-mix(in srgb, currentColor 55%, transparent);
        opacity: 1;
      }

      #refresh {
        flex: 0 0 28px;
        list-style-image: none;
        background-image: none;
      }

      #refresh[status="animate"] #refresh-icon {
        animation: rotating 2s linear infinite;
      }

      #refresh:disabled {
        cursor: default;
      }

      .footer-settings {
        display: flex;
        flex: 0 0 28px;
      }

      #footer-settings-icon {
        width: 18px;
        height: 18px;
        background-image: url("chrome://zotero/skin/20/universal/cog.svg");
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
        -moz-context-properties: fill, fill-opacity;
        fill: currentColor;
        pointer-events: none;
      }

      .footer-container {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 4px;
      }

      .footer-filter-group {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .footer-right-group {
        display: flex;
        align-items: center;
        margin-left: auto;
        min-width: 0;
        flex-wrap: nowrap;
      }

      #sources {
        height: 28px;
        min-height: 28px;
      }
    </style>
    <link rel="localization" href="__addonRef__-addonTable.ftl" />
  </head>

  <body>
    <div class="viewport-container">
      <div id="list-container" class="viewport list-viewport">
        <div id="listContainerPlaceholder"></div>
        <div id="listContainerColumnMenuPlaceholder"></div>
        <div id="table-container"></div>
      </div>
    </div>
    <div
      class="footer-container"
      xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
    >
      <!-- zotero original source: https://github.com/zotero/zotero/blob/3b7dd58c504884a55fab345efbc06de366983ab2/chrome/content/zotero/zoteroPane.xhtml#L1184 -->
      <html:div id="footer-search-group">
        <html:div id="search-shell">
          <html:button
            id="search-button"
            type="button"
            data-l10n-id="search-field"
            data-l10n-attrs="aria-label"
            aria-controls="search-field"
            aria-expanded="false"
          >
            <html:span id="search-icon" aria-hidden="true"></html:span>
          </html:button>
          <html:input
            id="search-field"
            type="text"
            disabled="true"
            data-l10n-id="search-field"
            data-l10n-attrs="placeholder"
          ></html:input>
        </html:div>

        <html:button
          id="refresh"
          type="button"
          data-l10n-id="refresh"
          data-l10n-attrs="aria-label"
        >
          <html:span id="refresh-icon" aria-hidden="true"></html:span>
        </html:button>
      </html:div>

      <groupbox>
        <div class="footer-filter-group">
          <label data-l10n-id="selectSource"></label>
          <div id="sourceContainerPlaceholder"></div>
        </div>
      </groupbox>
      <groupbox id="customSource-container">
        <div class="footer-filter-group">
          <label data-l10n-id="customSource"></label>
          <html:input type="text" id="customSourceInput"></html:input>
        </div>
      </groupbox>

      <div class="footer-right-group">
        <html:div id="footer-settings" class="footer-settings">
          <html:button
            id="footer-settings-button"
            type="button"
            data-l10n-id="settings"
            data-l10n-attrs="aria-label"
            aria-controls="footer-settings-popup"
            aria-expanded="false"
            aria-haspopup="menu"
          >
            <html:span id="footer-settings-icon" aria-hidden="true"></html:span>
          </html:button>
          <xul:menupopup id="footer-settings-popup" needsgutter="true">
            <xul:menuitem
              id="auto-update"
              type="checkbox"
              data-l10n-id="autoUpdate"
            ></xul:menuitem>
            <xul:menuseparator></xul:menuseparator>
            <xul:menuitem
              id="hide-toolbar-entrance"
              type="checkbox"
              data-l10n-id="hideToolbarEntrance"
            ></xul:menuitem>
            <xul:menuseparator></xul:menuseparator>
            <xul:menu id="footer-settings-tag-menu"></xul:menu>
            <xul:menuseparator></xul:menuseparator>
            <xul:menu id="footer-settings-scope-menu"></xul:menu>
          </xul:menupopup>
        </html:div>
      </div>
    </div>
  </body>
</html>
